openapi: 3.0.3
info:
  title: Plan API - 计划接口
  description: |
    计划相关接口，包括：
    - 近期任务（RecentTask）：增删改查、按状态/优先级筛选
    - 目标（Goal）：增删改查，含关键结果（Key Result）与季度/年度分类

    ## 认证方式
    所有接口需要在请求头中携带 JWT Token：
    ```
    Authorization: Bearer {your_jwt_token}
    ```

    ## 响应格式
    所有接口遵循统一的响应格式：
    ```json
    {
      "err_code": 0,
      "msg": "success",
      "detail": "",
      "data": {}
    }
    ```
  version: 1.0.0
  contact:
    name: Backend Superone API Support

servers:
  - url: /api/so
    description: API 基础路径

tags:
  - name: RecentTask
    description: 近期任务接口
  - name: Goal
    description: 目标管理接口

paths:
  /plan/recent_task/list:
    post:
      tags:
        - RecentTask
      summary: 获取近期任务列表
      description: 分页获取近期任务列表，支持关键词搜索、状态与优先级筛选
      operationId: getRecentTaskList
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRecentTaskListReq'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  offset: 0
                  size: 20
                  total: 1
                  list:
                    - id: 1
                      title: "写周报"
                      status: 1
                      priority: 2
        '400':
          description: 参数错误

  /plan/recent_task/detail:
    get:
      tags:
        - RecentTask
      summary: 获取近期任务详情
      description: 根据任务ID获取任务详情
      operationId: getRecentTaskDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: 任务ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  title: "写周报"
                  description: ""
                  status: 1
                  priority: 2
        '400':
          description: 参数错误

  /plan/recent_task/create:
    post:
      tags:
        - RecentTask
      summary: 创建近期任务
      description: 创建一条近期任务
      operationId: createRecentTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecentTaskReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  title: "写周报"
        '400':
          description: 参数错误

  /plan/recent_task/update:
    post:
      tags:
        - RecentTask
      summary: 更新近期任务
      description: 部分更新近期任务，只有传递的字段才会更新
      operationId: updateRecentTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecentTaskReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  title: "新标题"
        '400':
          description: 参数错误

  /plan/recent_task/delete:
    post:
      tags:
        - RecentTask
      summary: 删除近期任务
      description: 根据任务ID删除近期任务
      operationId: deleteRecentTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRecentTaskReq'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  success: true
        '400':
          description: 参数错误

  /plan/goal/list:
    post:
      tags:
        - Goal
      summary: 获取目标列表
      description: 分页获取目标列表，支持关键词、年份、季度、类型、状态、优先级筛选
      operationId: getGoalList
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetGoalListReq'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  offset: 0
                  size: 20
                  total: 1
                  list:
                    - id: 1
                      title: "Q1 上线新版本"
                      year: 2026
                      quarter: 1
                      status: 2
                      priority: 3
                      type: 1
        '400':
          description: 参数错误

  /plan/goal/detail:
    get:
      tags:
        - Goal
      summary: 获取目标详情
      description: 根据目标ID获取详情，含关键结果列表
      operationId: getGoalDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: 目标ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  title: "Q1 上线新版本"
                  year: 2026
                  quarter: 1
                  status: 2
                  priority: 3
                  type: 1
                  archived: false
                  key_results:
                    - title: "完成灰度"
                      progress: 60
        '400':
          description: 参数错误

  /plan/goal/create:
    post:
      tags:
        - Goal
      summary: 创建目标
      description: 创建季度或年度目标，可同时带上关键结果
      operationId: createGoal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  title: "Q1 上线新版本"
        '400':
          description: 参数错误

  /plan/goal/update:
    post:
      tags:
        - Goal
      summary: 更新目标
      description: 部分更新目标，只有传递的字段才会更新
      operationId: updateGoal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  title: "新标题"
        '400':
          description: 参数错误

  /plan/goal/delete:
    post:
      tags:
        - Goal
      summary: 删除目标
      description: 根据目标ID删除目标
      operationId: deleteGoal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteGoalReq'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  success: true
        '400':
          description: 参数错误

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token 认证

  schemas:
    StandardResponse:
      type: object
      required:
        - err_code
        - msg
        - detail
      properties:
        err_code:
          type: integer
          format: int32
          description: 错误码，0 表示成功，负数表示失败
          example: 0
        msg:
          type: string
          description: 提示信息
          example: "success"
        detail:
          type: string
          description: 错误详情，成功时为空字符串
          example: ""
        data:
          description: 业务数据，具体结构在各接口的 example 中给出
          oneOf:
            - type: object
            - type: array
            - type: 'null'

    TaskPriority:
      type: integer
      description: 任务优先级，1=低 2=中 3=高
      enum: [1, 2, 3]
      example: 2

    TaskStatus:
      type: integer
      description: 任务状态，1=待处理 2=进行中 3=已完成 4=已取消
      enum: [1, 2, 3, 4]
      example: 1

    GoalStatus:
      type: integer
      description: 目标/关键结果状态，1=未开始 2=进行中 3=已完成 4=有风险
      enum: [1, 2, 3, 4]
      example: 2

    GoalPriority:
      type: integer
      description: 目标优先级，1=低 2=中 3=高
      enum: [1, 2, 3]
      example: 3

    GoalType:
      type: integer
      description: 目标类型，1=季度目标 2=年度目标
      enum: [1, 2]
      example: 1

    Quarter:
      type: integer
      description: 季度，0=年度 1~4=第一至第四季度
      enum: [0, 1, 2, 3, 4]
      example: 1

    KeyResultForm:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 128
          description: 关键结果标题
          example: "完成灰度"
        description:
          type: string
          maxLength: 1000
          description: 关键结果描述
          example: ""
        status:
          $ref: '#/components/schemas/GoalStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 进度百分比
          example: 60

    GetRecentTaskListReq:
      type: object
      properties:
        keyword:
          type: string
          description: 搜索关键词（可选）
          example: ""
        offset:
          type: integer
          description: 偏移量
          example: 0
        size:
          type: integer
          description: 每页数量
          example: 20
        status_list:
          type: array
          description: 状态筛选列表（可选）
          items:
            $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    CreateRecentTaskReq:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
          maxLength: 128
          description: 任务标题
          example: "写周报"
        description:
          type: string
          maxLength: 1000
          description: 任务描述
          example: ""
        priority:
          $ref: '#/components/schemas/TaskPriority'
        deadline:
          type: integer
          format: int64
          description: 截止日期
          example: 1767225600

    UpdateRecentTaskReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 任务ID
          example: 1
        title:
          type: string
          maxLength: 128
          description: 任务标题（可选）
          example: "新标题"
        description:
          type: string
          maxLength: 1000
          description: 任务描述（可选）
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        deadline:
          type: integer
          format: int64
          description: 截止日期（可选）
        top:
          type: integer
          description: 置顶权重（可选）
          example: 100

    DeleteRecentTaskReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 任务ID
          example: 1

    GetGoalListReq:
      type: object
      properties:
        offset:
          type: integer
          description: 偏移量
          example: 0
        size:
          type: integer
          description: 每页数量
          example: 20
        keyword:
          type: string
          description: 搜索关键词（可选）
          example: ""
        year:
          type: integer
          description: 年份筛选（可选）
          example: 2026
        quarter:
          $ref: '#/components/schemas/Quarter'
        type:
          $ref: '#/components/schemas/GoalType'
        status:
          $ref: '#/components/schemas/GoalStatus'
        priority:
          $ref: '#/components/schemas/GoalPriority'

    CreateGoalReq:
      type: object
      required:
        - title
        - year
        - priority
      properties:
        title:
          type: string
          maxLength: 128
          description: 目标标题
          example: "Q1 上线新版本"
        description:
          type: string
          maxLength: 5000
          description: 目标描述
          example: ""
        year:
          type: integer
          description: 所属年份
          example: 2026
        quarter:
          description: 所属季度，年度目标传 0
          allOf:
            - $ref: '#/components/schemas/Quarter'
        priority:
          $ref: '#/components/schemas/GoalPriority'
        key_results:
          type: array
          description: 关键结果列表
          items:
            $ref: '#/components/schemas/KeyResultForm'
        deadline:
          type: integer
          format: int64
          description: 截止日期
          example: 1767225600

    UpdateGoalReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 目标ID
          example: 1
        title:
          type: string
          maxLength: 128
          description: 目标标题（可选）
          example: "新标题"
        description:
          type: string
          maxLength: 5000
          description: 目标描述（可选）
        year:
          type: integer
          description: 所属年份（可选）
        quarter:
          $ref: '#/components/schemas/Quarter'
        priority:
          $ref: '#/components/schemas/GoalPriority'
        key_results:
          type: array
          description: 关键结果列表（可选）
          items:
            $ref: '#/components/schemas/KeyResultForm'
        deadline:
          type: integer
          format: int64
          description: 截止日期（可选）
        top:
          type: integer
          description: 置顶权重（可选）
          example: 100
        archived:
          type: boolean
          description: 是否归档（可选）
          example: false

    DeleteGoalReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 目标ID
          example: 1
