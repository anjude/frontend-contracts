openapi: 3.0.3
info:
  title: Skill API
  version: 2.0.0
  description: 以登录身份访问个人、所属组织和公开 Skill。错误使用统一业务响应信封。
servers:
  - url: /api/so/mcp
security:
  - BearerAuth: []
paths:
  /skill/list:
    post:
      summary: 按分类分页列出 Skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListReq'
      responses:
        '200':
          description: 统一响应信封，data 为分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      operationId: list
  /skill/detail:
    get:
      summary: 根据 ID 读取文件包
      parameters:
        - name: skill_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 统一响应信封，data 为 Skill 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
      operationId: detail
  /skill/create:
    post:
      summary: 创建 Skill，owner 三类合计限制 30 条
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReq'
      responses:
        '200':
          description: 统一响应信封，data 为初始版本元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
      operationId: create
  /skill/update:
    post:
      summary: 发布者以 ID 和版本更新分类和完整文件包
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReq'
      responses:
        '200':
          description: 统一响应信封，data 为更新后的元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
      operationId: update
  /skill/delete:
    post:
      summary: 发布者以 ID 和版本物理删除并释放名额
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteReq'
      responses:
        '200':
          description: 统一业务响应信封
          content:
            application/json:
              schema:
                type: object
                required:
                  - err_code
                  - msg
                  - detail
                  - data
                properties:
                  err_code:
                    type: integer
                  msg:
                    type: string
                  detail:
                    type: string
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/DeleteResp'
                      - type: object
                        nullable: true
      operationId: delete
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Scope:
      type: object
      required:
        - category
      properties:
        category:
          type: string
          enum:
            - personal
            - team
            - public
        organization_id:
          type: integer
          format: int64
          description: team 必须为正数，其他分类为零
    Files:
      type: object
      required:
        - files
      properties:
        files:
          type: object
          description: 相对路径到标准 Base64 内容的映射；包含非空 SKILL.md，最多 64 个文件和 256 KiB 解码内容
          additionalProperties:
            type: string
    VersionedID:
      type: object
      required:
        - skill_id
        - revision
      properties:
        skill_id:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 1
    SkillInfo:
      type: object
      required:
        - skill_id
        - skill_name
        - category
        - organization_id
        - owner_id
        - owner_name
        - digest
        - revision
      properties:
        skill_id:
          type: integer
          format: int64
        skill_name:
          type: string
        category:
          type: string
          enum:
            - personal
            - team
            - public
        organization_id:
          type: integer
          format: int64
        owner_id:
          type: integer
          format: int64
        owner_name:
          type: string
        digest:
          type: string
          description: 规范化文件包 SHA-256
        revision:
          type: integer
          format: int64
    Envelope:
      type: object
      required:
        - err_code
        - msg
        - detail
        - data
      properties:
        err_code:
          type: integer
          description: 0 为成功，其余为业务错误
        msg:
          type: string
        detail:
          type: string
    InfoResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/SkillInfo'
                - type: object
                  nullable: true
    DetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/SkillInfo'
                    - $ref: '#/components/schemas/Files'
                - type: object
                  nullable: true
    ListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    offset:
                      type: integer
                    size:
                      type: integer
                    total:
                      type: integer
                      format: int64
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/SkillInfo'
                - type: object
                  nullable: true
    DeleteResp:
      type: object
      properties:
        skill_id:
          type: integer
          format: int64
    ListReq:
      allOf:
        - $ref: '#/components/schemas/Scope'
        - type: object
          properties:
            offset:
              type: integer
              minimum: 0
              default: 0
            size:
              type: integer
              minimum: 0
              maximum: 100
              default: 20
    CreateReq:
      allOf:
        - $ref: '#/components/schemas/Scope'
        - $ref: '#/components/schemas/Files'
        - type: object
          required:
            - skill_name
          properties:
            skill_name:
              type: string
              pattern: ^[a-z0-9][a-z0-9-]{0,63}$
    UpdateReq:
      allOf:
        - $ref: '#/components/schemas/Scope'
        - $ref: '#/components/schemas/Files'
        - $ref: '#/components/schemas/VersionedID'
    DeleteReq:
      $ref: '#/components/schemas/VersionedID'
