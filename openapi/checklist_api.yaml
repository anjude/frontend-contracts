openapi: 3.0.3
info:
  title: Checklist API - 清单管理接口
  description: |
    清单管理相关接口，包括：
    - 清单管理：创建、查询、更新、删除清单
    - 执行记录：创建、查询、更新、删除、历史查询
    
    ## 认证方式
    所有接口需要在请求头中携带 JWT Token：
    ```
    Authorization: Bearer {your_jwt_token}
    ```
    
    ## 响应格式
    所有接口遵循统一的响应格式：
    ```json
    {
      "err_code": 0,
      "msg": "success",
      "detail": "",
      "data": {}
    }
    ```
  version: 1.0.0
  contact:
    name: Backend Superone API Support

servers:
  - url: /api/so
    description: API 基础路径

tags:
  - name: Checklist
    description: 清单管理相关接口
  - name: Execution
    description: 清单执行记录相关接口

paths:
  /checklist/execution/list:
    post:
      tags:
        - Execution
      summary: 获取清单执行记录列表
      description: 分页获取清单执行记录列表，支持按清单ID和状态筛选
      operationId: getExecutionList
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExecutionListReq'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  offset: 0
                  size: 20
                  total: 100
                  list:
                    - id: 1
                      openid: "account_xxx"
                      checklist_id: 123
                      title: "执行记录标题"
                      mode: 0
                      overall_summary_md: "整体总结"
                      step_summaries: []
                      start_time: 1704067200
                      finish_time: 1704070800
                      status: 1
                      create_time: 1704067200
                      update_time: 1704070800
        '400':
          description: 参数错误

  /checklist/execution/detail:
    get:
      tags:
        - Execution
      summary: 获取清单执行记录详情
      description: 根据执行记录ID获取详细信息
      operationId: getExecutionDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 执行记录ID
          example: 1
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  openid: "account_xxx"
                  checklist_id: 123
                  title: "执行记录标题"
                  mode: 0
                  overall_summary_md: "整体总结"
                  step_summaries: []
                  start_time: 1704067200
                  finish_time: 1704070800
                  status: 1
                  create_time: 1704067200
                  update_time: 1704070800
        '400':
          description: 参数错误

  /checklist/execution/create:
    post:
      tags:
        - Execution
      summary: 创建清单执行记录
      description: 创建新的清单执行记录
      operationId: createExecution
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  openid: "account_xxx"
                  checklist_id: 123
                  title: "执行记录标题"
                  mode: 0
                  overall_summary_md: "整体总结"
                  step_summaries: []
                  start_time: 1704067200
                  finish_time: null
                  status: 0
                  create_time: 1704067200
                  update_time: 1704067200
        '400':
          description: 参数错误

  /checklist/execution/update:
    post:
      tags:
        - Execution
      summary: 更新清单执行记录
      description: 部分更新清单执行记录，只有传递的字段才更新
      operationId: updateExecution
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExecutionReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  id: 1
                  openid: "account_xxx"
                  checklist_id: 123
                  title: "更新后的标题"
                  mode: 0
                  overall_summary_md: "更新后的总结"
                  step_summaries: []
                  start_time: 1704067200
                  finish_time: 1704070800
                  status: 1
                  create_time: 1704067200
                  update_time: 1704070800
        '400':
          description: 参数错误

  /checklist/execution/delete:
    post:
      tags:
        - Execution
      summary: 删除清单执行记录
      description: 删除指定的清单执行记录
      operationId: deleteExecution
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteExecutionReq'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data: null
        '400':
          description: 参数错误

  /checklist/execution/history:
    post:
      tags:
        - Execution
      summary: 获取清单执行历史
      description: 获取指定清单的执行历史记录
      operationId: getExecutionHistory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExecutionHistoryReq'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
              example:
                err_code: 0
                msg: "success"
                detail: ""
                data:
                  offset: 0
                  size: 20
                  total: 50
                  list:
                    - id: 1
                      openid: "account_xxx"
                      checklist_id: 123
                      title: "执行记录标题"
                      mode: 0
                      overall_summary_md: "整体总结"
                      step_summaries: []
                      start_time: 1704067200
                      finish_time: 1704070800
                      status: 1
                      create_time: 1704067200
                      update_time: 1704070800
        '400':
          description: 参数错误

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardResponse:
      type: object
      properties:
        err_code:
          type: integer
          description: 错误码，0表示成功
          example: 0
        msg:
          type: string
          description: 响应消息
          example: "success"
        detail:
          type: string
          description: 详细信息
          example: ""
        data:
          description: 响应数据

    GetExecutionListReq:
      type: object
      properties:
        checklist_id:
          type: integer
          format: int64
          description: 清单ID（可选）
          example: 123
        offset:
          type: integer
          description: 偏移量（可选，默认0）
          example: 0
        size:
          type: integer
          description: 每页大小（可选，默认20，最大100）
          example: 20
        status:
          type: integer
          description: 执行状态（可选，0=进行中,1=已完成）
          enum: [0, 1]
          example: 1

    GetExecutionListResp:
      type: object
      properties:
        offset:
          type: integer
          description: 偏移量
          example: 0
        size:
          type: integer
          description: 每页大小
          example: 20
        total:
          type: integer
          format: int64
          description: 总数量
          example: 100
        list:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistExecutionRecordEntity'
          description: 执行记录列表

    GetExecutionDetailReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 执行记录ID
          example: 1

    GetExecutionDetailResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChecklistExecutionRecordEntity'

    CreateExecutionReq:
      type: object
      required:
        - checklist_id
        - mode
        - start_time
        - status
      properties:
        checklist_id:
          type: integer
          format: int64
          description: 清单ID（必填）
          example: 123
        mode:
          type: integer
          description: 执行模式（必填，0=执行,1=分步执行）
          enum: [0, 1]
          example: 0
        title:
          type: string
          description: 标题（可选）
          example: "执行记录标题"
        overall_summary_md:
          type: string
          description: 整体总结（可选，Markdown格式）
          example: "整体总结内容"
        step_summaries:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistExecutionStep'
          description: 步骤总结列表（可选）
        start_time:
          type: integer
          format: int64
          description: 开始时间（必填，Unix时间戳，秒）
          example: 1704067200
        finish_time:
          type: integer
          format: int64
          description: 完成时间（可选，Unix时间戳，秒）
          example: 1704070800
        status:
          type: integer
          description: 执行状态（必填，0=进行中,1=已完成）
          enum: [0, 1]
          example: 0

    CreateExecutionResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChecklistExecutionRecordEntity'

    UpdateExecutionReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 执行记录ID（必填）
          example: 1
        checklist_id:
          type: integer
          format: int64
          description: 清单ID（可选）
          example: 123
        mode:
          type: integer
          description: 执行模式（可选，0=执行,1=分步执行）
          enum: [0, 1]
          example: 0
        title:
          type: string
          description: 标题（可选）
          example: "更新后的标题"
        overall_summary_md:
          type: string
          description: 整体总结（可选，Markdown格式）
          example: "更新后的总结"
        step_summaries:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistExecutionStep'
          description: 步骤总结列表（可选）
        start_time:
          type: integer
          format: int64
          description: 开始时间（可选，Unix时间戳，秒）
          example: 1704067200
        finish_time:
          type: integer
          format: int64
          description: 完成时间（可选，Unix时间戳，秒）
          example: 1704070800
        status:
          type: integer
          description: 执行状态（可选，0=进行中,1=已完成）
          enum: [0, 1]
          example: 1

    UpdateExecutionResp:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChecklistExecutionRecordEntity'

    DeleteExecutionReq:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 执行记录ID（必填）
          example: 1

    DeleteExecutionResp:
      type: object
      description: 空响应

    GetExecutionHistoryReq:
      type: object
      required:
        - checklist_id
      properties:
        checklist_id:
          type: integer
          format: int64
          description: 清单ID（必填）
          example: 123
        offset:
          type: integer
          description: 偏移量（可选，默认0）
          example: 0
        size:
          type: integer
          description: 每页大小（可选，默认20，最大100）
          example: 20
        start_time:
          type: integer
          format: int64
          description: 开始时间范围（可选，Unix时间戳，秒）
          example: 1704067200
        end_time:
          type: integer
          format: int64
          description: 结束时间范围（可选，Unix时间戳，秒）
          example: 1704153600

    GetExecutionHistoryResp:
      type: object
      properties:
        offset:
          type: integer
          description: 偏移量
          example: 0
        size:
          type: integer
          description: 每页大小
          example: 20
        total:
          type: integer
          format: int64
          description: 总数量
          example: 50
        list:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistExecutionRecordEntity'
          description: 执行历史列表

    ChecklistExecutionStep:
      type: object
      properties:
        item_id:
          type: integer
          format: int64
          description: 项目ID
          example: 1
        summary_md:
          type: string
          description: 步骤总结（Markdown格式）
          example: "步骤总结内容"
        confirm_time:
          type: integer
          format: int64
          description: 确认时间（Unix时间戳，秒）
          example: 1704067200
        is_skipped:
          type: boolean
          description: 是否跳过
          example: false

    ChecklistExecutionRecordEntity:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 执行记录ID
          example: 1
        openid:
          type: string
          description: 用户openid
          example: "account_xxx"
        checklist_id:
          type: integer
          format: int64
          description: 清单ID
          example: 123
        title:
          type: string
          description: 标题
          example: "执行记录标题"
        mode:
          type: integer
          description: 执行模式（0=执行,1=分步执行）
          enum: [0, 1]
          example: 0
        overall_summary_md:
          type: string
          description: 整体总结（Markdown格式）
          example: "整体总结内容"
        step_summaries:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistExecutionStep'
          description: 步骤总结列表
        start_time:
          type: integer
          format: int64
          description: 开始时间（Unix时间戳，秒）
          example: 1704067200
        finish_time:
          type: integer
          format: int64
          description: 完成时间（Unix时间戳，秒）
          example: 1704070800
        status:
          type: integer
          description: 执行状态（0=进行中,1=已完成）
          enum: [0, 1]
          example: 1
        create_time:
          type: integer
          format: int64
          description: 创建时间（Unix时间戳，秒）
          example: 1704067200
        update_time:
          type: integer
          format: int64
          description: 更新时间（Unix时间戳，秒）
          example: 1704070800

