openapi: 3.0.3
info:
  title: 跨项目功能埋点 API
  version: 1.0.0
servers:
  - url: /api/so
paths:
  /analytics/events/batch:
    post:
      operationId: collectFeatureEvents
      summary: 批量上报一个项目的功能事件
      description: 所有业务结果使用 HTTP 200 和 err_code 表示。服务端按项目核验 JWT，并从凭证读取 app_id 和 actor_key；请求中额外字段会被忽略。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
      responses:
        '200':
          description: 业务状态见 err_code。成功时返回逐条回执，重复有效事件也返回 accepted。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProjectOrBusinessKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
    EventId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    BatchRequest:
      type: object
      additionalProperties: true
      description: 未声明字段会被忽略；字段类型或 JSON 结构错误会导致整批请求参数错误。
      required: [project_key, schema_version, events]
      properties:
        project_key: {$ref: '#/components/schemas/ProjectOrBusinessKey'}
        schema_version: {type: integer, enum: [1]}
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/FeatureEvent'}
    FeatureEvent:
      type: object
      additionalProperties: true
      description: 服务端只解析定义字段，额外字段不会写入事件或用于身份判断。
      required: [event_id, visit_id, event_name, business_key, feature_key, item_key, source, occurred_at, app_version]
      properties:
        event_id: {$ref: '#/components/schemas/EventId'}
        visit_id: {$ref: '#/components/schemas/EventId'}
        attempt_id:
          allOf: [{$ref: '#/components/schemas/EventId'}]
          description: 开始和完成必填，打开和分享省略。
        event_name: {type: string, enum: [feature_open, feature_start, feature_complete, feature_share_intent]}
        business_key: {$ref: '#/components/schemas/ProjectOrBusinessKey'}
        feature_key: {$ref: '#/components/schemas/ProjectOrBusinessKey'}
        item_key: {type: string, pattern: '^[a-zA-Z0-9_-]{0,64}$'}
        source: {type: string, enum: [home, catalog, daily_challenge, share, unknown]}
        content_version: {type: integer, minimum: 1, maximum: 4294967295, description: 配置测试必填，其他功能省略。}
        occurred_at: {type: integer, minimum: 1, maximum: 4294967295, description: Unix 秒，最长迟到 48 小时，最多领先 5 分钟。}
        app_version: {type: string, pattern: '^[a-zA-Z0-9.+_-]{0,32}$'}
    BatchResponse:
      type: object
      required: [err_code, msg, detail, data]
      properties:
        err_code: {type: integer, description: 0 成功，-100001 参数错误，-100002 存储错误，-100004 登录错误，-100008 无权限，-100012 限流。}
        msg: {type: string}
        detail: {type: string}
        data:
          type: object
          nullable: true
          required: [collection_enabled, results]
          properties:
            collection_enabled: {type: boolean}
            results:
              type: array
              items:
                type: object
                required: [index, status]
                properties:
                  index: {type: integer, minimum: 0}
                  status: {type: string, enum: [accepted, rejected]}
                  reason: {type: string, enum: [invalid_event, unknown_business, unknown_feature_item, invalid_time]}
